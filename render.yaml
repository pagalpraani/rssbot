# =============================================================================
# Module: render.yaml
# Path: render.yaml
# Description: Configuration file containing deployment service definitions and
#              environment specifications.
# =============================================================================

services:
  - type: web
    name: rss-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m main"
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: RSSFeedBot
      - key: OWNER_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DEV_LOG_CHANNEL
        sync: false
      - key: RSS_PROCESSED_CACHE_CAP
        value: 1000
      - key: RSS_MAX_NEW_ITEMS_PER_CYCLE
        value: 30
