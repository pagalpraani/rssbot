# =============================================================================
# Module: render.yaml
# Path: render.yaml
# Description: Configuration file containing deployment service definitions and
#              environment specifications.
# =============================================================================

services:
  - type: web
    name: tg-utility-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m utilitybot.main"
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: RSSFeedBot
      - key: OWNER_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RETENTION_DAYS
        value: 90
      - key: METRICS_ENABLED
        value: true
